<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajay Garg  Techstore | Premium Gadgets</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-mode" id="body">

    <nav class="navbar">
        <div class="nav-left">
            <a href="#" class="logo">AG<span></span></a>
        </div>
        <div class="nav-center">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search premium gadgets...">
            </div>
        </div>
        <div class="nav-right">
            <button id="themeToggle" class="icon-btn"><i class="fas fa-sun"></i></button>
            <div class="cart-icon icon-btn" id="cartIcon">
                <i class="fas fa-shopping-bag"></i>
                <span id="cartBadge">0</span>
            </div>
        </div>
    </nav>

    <div class="layout-container">
        <aside class="sidebar">
            <h3>Categories</h3>
            <ul class="category-list" id="categoryList">
                <li class="active" onclick="filterCategory('All')">All Products</li>
                <li onclick="filterCategory('Gaming')">Gaming</li>
                <li onclick="filterCategory('Audio')">Audio</li>
                <li onclick="filterCategory('Workspace')">Workspace</li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="products-header">
                <h2 id="categoryTitle">All Products</h2>
                <div class="sort-box">
                    <select id="sortSelect" onchange="sortProducts()">
                        <option value="default">Sort By: Featured</option>
                        <option value="lowToHigh">Price: Low to High</option>
                        <option value="highToLow">Price: High to Low</option>
                    </select>
                </div>
            </div>
            
            <div class="products-grid" id="productsGrid">
                </div>
        </main>
    </div>

    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h2>Your Shopping Cart</h2>
            <button class="icon-btn" id="closeCart"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="cart-items" id="cartItems">
            </div>
        
<div class="cart-footer">
            <div class="summary-row">
                <span class="text-muted">Subtotal</span>
                <span id="cartSubtotal">₹0</span>
            </div>
            <div class="summary-row">
                <span class="text-muted">GST (18%)</span>
                <span id="cartGst">₹0</span>
            </div>
            <div class="summary-row total-row">
                <span>Final Total</span>
                <span id="cartTotalFinal">₹0</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
            <div class="summary-row" style="color: var(--text-muted); font-size: 14px;">
                <span>Shipping</span>
                <span>Free Delivery</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <div id="toast" class="toast"><i class="fas fa-check-circle"></i> Item added to cart!</div>

    <script src="script.js"></script>
</body>
</html>
